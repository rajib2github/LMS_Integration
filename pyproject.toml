[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "student-assist-lti"
version = "0.1.0"
description = "Reusable LTI 1.3 OIDC login and launch validation for Student Assist"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["PyJWT[crypto]>=2.8,<3", "fastapi>=0.110,<1", "httpx>=0.27,<1", "python-multipart>=0.0.9,<1"]

[project.optional-dependencies]
demo = ["streamlit>=1.35,<2", "uvicorn[standard]>=0.29,<1", "requests>=2.31,<3", "bleach>=6,<7"]

[tool.setuptools.packages.find]
where = ["src"]
